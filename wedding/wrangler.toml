# Cloudflare Worker for wedding.webecke.dev.
# Static files in dist/ are served directly; /api/* and /admin* run the Worker
# (worker/index.ts). Plain variables and bindings live here; secrets are set
# in the dashboard (Worker > Settings > Variables and Secrets).
name = "wedding-webecke-dev"
main = "worker/index.ts"
compatibility_date = "2025-06-01"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/admin", "/admin/*"]

[vars]
# Public Turnstile site key (Cloudflare dashboard > Turnstile > your widget).
TURNSTILE_SITE_KEY = "0x4AAAAAAGCnGAGLjCOeJjiq"
# Cloudflare Access team domain, e.g. "https://webecke.cloudflareaccess.com".
ACCESS_TEAM_DOMAIN = "https://winter-lake-ba12.cloudflareaccess.com"
# Access application's "Application Audience (AUD) Tag".
ACCESS_AUD = "3438d6dc36197e92147fd7e702a892a4f62f49c822e0126477ad8fbecb9031a1"

[[d1_databases]]
binding = "DB"
database_name = "wedding"
database_id = "cc6164b7-d39c-48a0-8f10-bab5943ac3bd"
migrations_dir = "migrations"

[dev]
port = 8788
